name: dependency
on:
    push:
        branches:
            - main
env:
  APP: ${{ vars.APP }}
  TAG: ${{ github.sha }}
jobs:
    check-out:
        runs-on: ubuntu-latest
        
        steps: 
            - name: check-out code
              uses: actions/checkout@v4
              with:
                ref: main
    pre-install:
        runs-on: ubuntu-latest
        needs: check-out
        steps:
            - uses: actions/checkout@v4
            - name: install python 
              uses: actions/setup-python@v5
              with:
                python-version: 3.12
            - name: install requremenst
              run: pip install -r requirements.txt
    build:
        runs-on: ubuntu-latest
        needs: pre-install
        outputs:
            image_tag: ${{ steps.build.outputs.image_tag }}
        steps:
            - uses: actions/checkout@v4
            - name: docker login 
              run: |
                echo "${{ secrets.DOCKER_PASSWORD}}" | docker login -u \
                 "${{secrets.DOCKER_USERNAME}}" \
                  --password-stdin
            - name: build imag
              id: build
              run: |
                docker build -t $APP:$TAG .
                echo "image_tag=$TAG">> $GITHUB_OUTPUT
            - name: push the docker image
              run: docker push $APP:$TAG
            
    deploy:
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: docker login
          run: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

        - name: pull the image
          run: |
            docker pull \
            $APP:${{ needs.build.outputs.image_tag }}

        - name: deploy
          run: |
            docker run -d \
            --name flask-APP \
            -p ${{ vars.HOST_PORT }}:${{ vars.CONTAINER_PORT }} \
            $APP:${{ needs.build.outputs.image_tag }}


