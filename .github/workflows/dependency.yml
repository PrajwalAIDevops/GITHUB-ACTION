name: dependency

on:
  push:
    branches:
      - main

env:
  APP: ${{ vars.APP }}
  TAG: ${{ github.sha }}

jobs:

  checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  install:
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

  build:
    runs-on: ubuntu-latest
    needs: install

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Debug Variables
        run: |
          echo "APP=$APP"
          echo "TAG=$TAG"

      - name: Build Docker Image
        id: image
        run: |
          docker build -t $APP:$TAG .

          # Pass image tag to next job
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Push Docker Image
        run: |
          docker push $APP:$TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Pull Docker Image
        run: |
          docker pull $APP:${{ needs.build.outputs.image_tag }}

      - name: Run Container
        run: |
          echo "APP=$APP"
          echo "HOST_POST=${{ vars.HOST_POST }}"
          echo "CONT_POST=${{ vars.CONT_POST }}"
          echo "IMAGE=${{ needs.build.outputs.image_tag }}"

      - name: Success
        run: |
          echo "Deployment Successful"
