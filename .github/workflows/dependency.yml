name: Flask CI/CD

on:
  push:
    branches:
      - main

env:
  APP: prajwaldevops1027/flask
  TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      - name: Build Image
        id: image
        run: |
          docker build -t $APP:$TAG .
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Push Image
        run: |
          docker push $APP:$TAG

  test-image:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      - name: Pull Image
        run: |
          docker pull $APP:${{ needs.build-and-push.outputs.image_tag }}

      - name: Run Container
        run: |
          docker run -d \
            --name flask-app \
            -p 8080:8080 \
            $APP:${{ needs.build-and-push.outputs.image_tag }}

      - name: Check Running Container
        run: |
          docker ps

      - name: Test Application
        run: |
          sleep 30
          curl http://localhost:8080