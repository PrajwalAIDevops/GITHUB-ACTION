name: Main Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    uses: ./.github/workflows/input.yml

    with:
      image_name: prajwaldevops1027/flask
      image_tag: v1

    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}