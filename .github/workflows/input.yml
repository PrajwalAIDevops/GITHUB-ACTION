name: input-deploy
on:
    workflow_call:
        inputs:
            image_name:
                required: true
                type: string
            image_tag:
                required: true
                type: string
        secrets:
            DOCKER_PASSWORD:
                required: true
            DOCKER_USERNAME:
                required: true        
jobs:
    checkout:
        runs-on: ubuntu-latest
        steps:
            - name: checkout the code
              uses: actions/checkout@v4
    pre-install:
        runs-on: ubuntu-latest
        needs: checkout
        steps:
            - uses: actions/checkout@v4
            - name: install requiremenets
              uses: actions/setup-python@v5
              with:
                python-version: 3.12
            - run: pip install -r requirements.txt
    build:
        runs-on: ubuntu-latest
        needs: pre-install
        outputs:
            image_tag: ${{ steps.build.outputs.image_tag}}
        steps:
            - uses: actions/checkout@v4
            - name: log in to docker
              run: |
                 echo "${{ secrets.DOCKER_PASSWORD}}" | \
                 docker login -u "${{ secrets.DOCKER_USERNAME }}" \ 
                 --password-stdin
        
            - name: docker build a image
              id: build
              run: |
                docker build -t $inputs.image_name:$inputs.image_tag . \
                docker push $inputs.image_name:$inputs.imag_tag  \
                echo "inputs.image_tag=$IMAGE_TAG" >> GITHUB_OUTPUT
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - name: deploy the app
              run: |
               docker pull  $image_name:${{needs.build.outputs.image_tag}} \
               docker run --name flask-app -d -p 8080:8080 ${{ inputs.image_name}} :${{needs.build.outputs.image_tag}}
              